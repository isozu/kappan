<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="ja" lang="ja"><head><meta charset="utf-8"></meta><title>序</title><link rel="stylesheet" type="text/css" href="../styles/theme.css"></link></head><body class="kappan-vertical-rl reader-generic"><h1>序</h1>
<p class="narrative kinsoku">これは Kappan の縦組み<span class="kinsoku-no-break">（v</span>ertical-r<span class="kinsoku-no-break">l）</span>機能を検証するため<span class="kinsoku-no-break">の、</span>架空の短編小説サンプルであ<span class="kinsoku-no-break">る。</span>
すべて書き下ろしのオリジナル文<span class="kinsoku-no-break">で、</span>商業品質の縦書き組版が成立するかを確かめるために
組版上の難所を意図して詰め込んであ<span class="kinsoku-no-break">る。</span></p>
<p class="narrative kinsoku">本作は三つの章からな<span class="kinsoku-no-break">る。</span>第<ruby>一<rt>いち</rt></ruby>章では会話と地の<span class="kinsoku-no-break">文、</span>ルビと圏点<span class="kinsoku-no-break">を、</span>第<ruby>二<rt>に</rt></ruby>章では
縦中横と欧文混在<span class="kinsoku-no-break">を、</span>第<ruby>三<rt>さん</rt></ruby>章では連続約物と長い段落の禁則を中心に踏ませてい<span class="kinsoku-no-break">る。</span></p>
<p class="narrative kinsoku"><em class="kenten">本作はフィクションであり、登場する人物・団体はすべて架空のものである</em>。</p></body></html>
