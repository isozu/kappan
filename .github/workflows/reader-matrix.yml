name: Reader Matrix

# RDD §11.3 リーダー互換性マトリクス。四半期に 1 度、実機リーダーで fixture を
# 表示確認 → 結果を tests/reader-compatibility/ に格納し、README.md の表を
# PR で自動更新する。
#
# 注意（M2-C 着地時点）：
#   - 縦組み（vertical-rl）は M2-A で取り込み予定のためここでは扱わない。M3 で追記する。
#   - Kindle Previewer 3 CLI は無料配布。インストール手順は手作業（GitHub-hosted runner では
#     公式インストーラ起動が必要なため、現状は手動セットアップ + macos self-hosted runner
#     を前提とする）。本ワークフローは skeleton のみで、実機チェックは M2-C 着地後の
#     追記タスクで有効化する。
#   - Thorium はヘッドレス起動が公式にはサポートされないため、当面 Puppeteer 経由で
#     EPUB の reflow ビューを開く想定。
#
# 起動条件：
#   - schedule: 四半期に 1 度（毎月 1 日 UTC 00:00 のうち 1/4/7/10 月）
#   - workflow_dispatch: 任意実行（README 更新を強制したい時）
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'

jobs:
  reader-matrix:
    # 実機リーダーが動く環境を要求するため macos-latest。Kindle Previewer は macOS 提供。
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build all fixtures
        run: |
          mkdir -p tests/reader-compatibility/build
          pnpm kappan build --config tests/fixtures/minimal-commonmark/kappan.config.ts \
            --out tests/reader-compatibility/build/minimal-commonmark
          pnpm kappan build --config tests/fixtures/tech-book-yokogumi/kappan.config.ts \
            --out tests/reader-compatibility/build/tech-book-yokogumi

      # Kindle Previewer 3 CLI は GitHub-hosted runner では未インストール。
      # M2-C スケルトン時点では skeleton step として残し、self-hosted runner で
      # 環境が整い次第 if:false を外す。
      - name: Run Kindle Previewer 3 (skeleton)
        if: false
        run: |
          for fixture in minimal-commonmark tech-book-yokogumi; do
            "/Applications/Kindle Previewer 3.app/Contents/MacOS/Kindle Previewer 3" \
              -convert "tests/reader-compatibility/build/${fixture}/"*.epub \
              -output "tests/reader-compatibility/results/${fixture}/kindle/" \
              -locale en
          done

      # Thorium reader はヘッドレス対応未提供のため、Puppeteer 経由で
      # readium-shared-js ベースの reflow を起動して screenshot する。
      # 実装は tests/reader-compatibility/scripts/thorium-headless.ts を将来追加。
      - name: Run Thorium (skeleton)
        if: false
        run: |
          node --import tsx tests/reader-compatibility/scripts/thorium-headless.ts

      # Apple Books の自動化は AppleScript 経由が現実的。本ワークフローでは
      # スクリーンショット差分の検出までを範囲とし、人手目視はリリース時に行う。
      - name: Run Apple Books (skeleton)
        if: false
        run: |
          osascript tests/reader-compatibility/scripts/apple-books.applescript

      # 縦組みフィクスチャの実機テストは M2-A 完了後（M3 追記）。
      - name: Run vertical-rl fixtures (deferred to M3)
        run: |
          echo "::notice::Vertical-rl reader tests deferred to M3 (after M2-A vertical writing lands)."

      # 結果から互換性マトリクスを再生成し、README.md を上書きする。
      # スクリプトは tests/reader-compatibility/scripts/update-readme.ts。
      - name: Regenerate compatibility matrix in README
        run: |
          node --import tsx tests/reader-compatibility/scripts/update-readme.ts \
            --results tests/reader-compatibility/results \
            --readme README.md \
            --commit

      - name: Upload reader-compat artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-compatibility-${{ github.run_id }}
          path: |
            tests/reader-compatibility/results
            tests/reader-compatibility/build
          if-no-files-found: warn
          retention-days: 90

      # CI が README.md を更新した場合、自動 PR を立てる。
      - name: Create PR for README update
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(readme): update reader compatibility matrix'
          title: '[reader-matrix] Update reader compatibility matrix'
          body: |
            Auto-generated by `.github/workflows/reader-matrix.yml`.

            This PR refreshes the reader compatibility section of `README.md` based on
            quarterly reader test runs. See RDD §11.3.
          branch: chore/reader-matrix-${{ github.run_id }}
          delete-branch: true
